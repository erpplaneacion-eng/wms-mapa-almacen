<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Códigos de Barra — CHVS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  :root {
    --bg: #f0f7f2;
    --surface: #ffffff;
    --card: #ffffff;
    --border: #c8e6c8;
    --accent: #16a34a;
    --accent2: #059669;
    --text: #1a2e1a;
    --muted: #6b7a6b;
    --white: #ffffff;

    --inv-INVASEO:   #f0a026;
    --inv-INVBIOSEGU:#26f074;
    --inv-INVCARNES: #f03d26;
    --inv-INVCONGELA:#26adf0;
    --inv-INVDOTACIO:#c426f0;
    --inv-INVDULCERI:#f026a8;
    --inv-INVEMPAQUE:#f0c826;
    --inv-INVFRUVER: #74f026;
    --inv-INVLACTEOS:#26f0d4;
    --inv-INVPANADER:#f07426;
    --inv-INVVIVERES:#f0e626;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 28px 40px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .header-brand {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .header-brand h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    line-height: 1;
  }
  .header-brand p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-controls {
    display: flex;
    gap: 12px;
    flex: 1;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px 9px 38px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: '⌕';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1.1rem;
  }

  select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--accent2); }

  .btn {
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .btn-print {
    background: var(--accent);
    color: #ffffff;
  }
  .btn-print:hover { background: #15803d; }
  .btn-back {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    padding: 9px 18px;
    border-radius: 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    transition: all 0.15s;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .btn-back:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }

  .stats {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .stats span { color: var(--accent2); font-weight: 600; }

  /* ── CATEGORY PILLS ── */
  .categories {
    padding: 16px 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .cat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .pill {
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px solid transparent;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill.active, .pill:hover {
    background: color-mix(in srgb, var(--pill-color) 20%, transparent);
    border-color: var(--pill-color);
    color: var(--pill-color);
  }
  .pill:not(.active) {
    color: var(--muted);
    border-color: var(--border);
  }

  /* ── MAIN GRID ── */
  main {
    padding: 32px 40px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    margin-top: 36px;
  }
  .section-header:first-child { margin-top: 0; }
  .section-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 0.12em;
    line-height: 1;
  }
  .section-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--card);
    padding: 3px 10px;
    border-radius: 100px;
    border: 1px solid var(--border);
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 8px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(22,163,74,0.15);
    border-color: var(--card-accent);
  }
  .card-stripe {
    height: 3px;
    background: var(--card-accent);
  }
  .card-logo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: auto;
    opacity: 0.5;
    pointer-events: none;
    z-index: 1;
  }
  .card-body {
    padding: 14px 16px 12px;
  }
  .card-cat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--card-accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-cat-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--card-accent);
    opacity: 0.7;
  }
  .card-name {
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    min-height: 2.2em;
    margin-bottom: 10px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .badge-code {
    color: var(--accent2);
    border-color: color-mix(in srgb, var(--accent2) 30%, transparent);
    background: color-mix(in srgb, var(--accent2) 8%, transparent);
    font-weight: 600;
  }

  .barcode-wrap {
    background: #ffffff;
    border: 1px solid #d8ead8;
    border-radius: 6px;
    padding: 10px 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: relative;
    overflow: hidden;
  }
  .barcode-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.02) 0%, transparent 60%);
    pointer-events: none;
  }
  .barcode-wrap svg {
    max-width: 100%;
    height: auto;
  }
  .barcode-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: #444;
    letter-spacing: 0.15em;
    margin-top: 2px;
  }

  /* ── NO RESULTS ── */
  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
  }

  /* ── PRINT ── */
  @media print {
    * { color-adjust: exact; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff !important; color: #000 !important; }
    header, .categories { display: none !important; }
    main { padding: 10px !important; }
    .card {
      background: #fff !important;
      border: 1px solid #ccc !important;
      break-inside: avoid;
    }
    .card:hover { transform: none; box-shadow: none; }
    .card-name, .card-cat { color: #222 !important; }
    .badge { background: #f5f5f5 !important; color: #444 !important; border-color: #ddd !important; }
    .badge-code { color: #005f7f !important; }
    .section-title { color: #000 !important; }
    .section-line { background: #ccc !important; }
    .cards-grid { gap: 12px !important; }
    .section-header { margin-top: 20px !important; }
  }
</style>
</head>

</header>

<div class="categories" id="categoryPills"></div>

<main id="main"></main>

  "INVASEO":   "Aseo",
  "INVASEO-L": "Aseo & Limpieza",
  "INVBIOSEGU":"Bioseguridad",
  "INVCARNES": "Carnes",
  "INVCONGELA":"Congelados",
  "INVDOTACIO":"Dotación",
  "INVDULCERI":"Dulcería",
  "INVEMPAQUE":"Empaques",
  "INVFRUVER": "Fruver",
  "INVLACTEOS":"Lácteos",
  "INVPANADER":"Panadería",
  "INVVIVERES":"Víveres",
};

// De-duplicate items by barcode
const seen = new Set();
const uniqueItems = items.filter(i => {
  const key = i.c + '|' + i.d;
  if(seen.has(key)) return false;
  seen.add(key);
  return true;
});

// Group by category
const groups = {};
uniqueItems.forEach(item => {
  if(!groups[item.t]) groups[item.t] = [];
  groups[item.t].push(item);
});

let activeCategory = null;

// Build category pills
const pillsEl = document.getElementById('categoryPills');
const allPill = document.createElement('button');
allPill.className = 'pill active';
allPill.textContent = 'Todos';
allPill.style.setProperty('--pill-color','#e8f026');
allPill.onclick = () => { activeCategory = null; render(); setActivePill(allPill); };
pillsEl.appendChild(document.createElement('span')).className = 'cat-label';
pillsEl.querySelector('.cat-label').textContent = 'Categoría:';
pillsEl.appendChild(allPill);

Object.keys(catLabels).forEach(cat => {
  if(!groups[cat]) return;
  const pill = document.createElement('button');
  pill.className = 'pill';
  pill.textContent = catLabels[cat];
  pill.style.setProperty('--pill-color', catColors[cat]);
  pill.onclick = () => { activeCategory = cat; render(); setActivePill(pill); };
  pillsEl.appendChild(pill);
});

function setActivePill(el) {
  pillsEl.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

function getFilteredItems() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const um = document.getElementById('umFilter').value;
  return uniqueItems.filter(i => {
    if(activeCategory && i.t !== activeCategory) return false;
    if(um && i.u.trim() !== um) return false;
    if(q && !i.d.toLowerCase().includes(q) && !i.c.includes(q)) return false;
    return true;
  });
}

function render() {
  const filtered = getFilteredItems();
  const main = document.getElementById('main');
  main.innerHTML = '';

  const grouped = {};
  filtered.forEach(i => {
    if(!grouped[i.t]) grouped[i.t] = [];
    grouped[i.t].push(i);
  });

  if(filtered.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'no-results';
    msg.textContent = '— Sin resultados —';
    main.appendChild(msg);
  }

  Object.entries(grouped).forEach(([cat, catItems]) => {
    const color = catColors[cat] || '#aaa';
    const label = catLabels[cat] || cat;

    // Section header
    const sh = document.createElement('div');
    sh.className = 'section-header';
    sh.innerHTML = `
      <div class="section-dot" style="background:${color}"></div>
      <div class="section-title" style="color:${color}">${label}</div>
      <div class="section-count">${catItems.length} items</div>
      <div class="section-line"></div>
    `;
    main.appendChild(sh);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    catItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--card-accent', color);

      const svgId = 'bc_' + item.c + '_' + Math.random().toString(36).slice(2,7);
      card.innerHTML = `
        <div class="card-stripe"></div>
        <img class="card-logo" src="CHVS_SOLO_MANITOS.png" alt="CHVS">
        <div class="card-body">
          <div class="card-cat">
            <div class="card-cat-dot"></div>${label}
          </div>
          <div class="card-name">${item.d}</div>
          <div class="card-meta">
            <span class="badge">UM: ${item.u.trim()}</span>
            <span class="badge badge-code"># ${item.c}</span>
          </div>
          <div class="barcode-wrap">
            <svg id="${svgId}"></svg>
          </div>
        </div>
      `;
      grid.appendChild(card);

      // Generate barcode after DOM insert
      requestAnimationFrame(() => {
        try {
          JsBarcode('#' + svgId, item.c, {
            format: 'CODE128',
            width: 1.8,
            height: 52,
            displayValue: false,
            margin: 0,
            background: '#ffffff',
            lineColor: '#111111',
          });
        } catch(e) {
          const el = document.getElementById(svgId);
          if(el) el.parentElement.innerHTML = `<span style="font-size:0.7rem;color:#888">Código: ${item.c}</span>`;
        }
      });
    });

    main.appendChild(grid);
  });

  document.getElementById('visibleCount').textContent = filtered.length;
}

function filterItems() { render(); }

render();
